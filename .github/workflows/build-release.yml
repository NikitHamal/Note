name: Build Note Release APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-note:
    name: Build Note App
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check horizontal scrollers
        run: python3 tools/android/check_scrollers.py

      - name: Check screen insets
        run: python3 tools/android/check_insets.py

      - name: Check bottom sheets
        run: python3 tools/android/check_sheets.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Generate release keystore if not provided
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > nebians-release.keystore
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore nebians-release.keystore -alias nebians -keyalg RSA -keysize 2048 -validity 10000 -storepass note_release_2026 -keypass note_release_2026 -dname "CN=Nikit Hamal, OU=Note, O=Consica, L=Kathmandu, S=Bagmati, C=NP"
            echo "KEYSTORE_PASSWORD=note_release_2026" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=note_release_2026" >> "$GITHUB_ENV"
          fi

      - name: Build Modern Release APK
        run: ./gradlew assembleModernRelease --build-cache
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g" -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configuration-cache=true

      - name: Upload Modern Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Note-modern-release-apk
          path: app/build/outputs/apk/modern/release/*.apk
          retention-days: 14
